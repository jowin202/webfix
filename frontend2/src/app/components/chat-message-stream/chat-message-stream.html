<div class="message-stream-content">
  @if (currentThread()) {
    @for (message of currentThread()!.messages; track message.id) {
      <div class="chat-message">
        <span class="user-name" [innerHTML]="message.user"></span><span class="user-name">:</span>
        <span class="message-text" [innerHTML]="message.text"></span>
        <span class="timestamp"> ({{ message.time }})</span>
      </div>
    } @empty {
      <div class="chat-message">
        <span class="message-text">Starte eine Unterhaltung in <span [innerHTML]="currentThread()!.name"></span>.</span>
      </div>
    }
  }
</div>
