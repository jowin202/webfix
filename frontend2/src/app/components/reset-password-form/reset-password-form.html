<div class="chat-container">
  <mat-card class="recover-card">

    <mat-card-title>Set New Password</mat-card-title>

    <form #resetForm="ngForm" class="recover-form" (ngSubmit)="resetPassword(resetForm.value)">

      <!-- NEW PASSWORD -->
      <mat-form-field appearance="outline" class="full-width-field">
        <mat-label>New Password</mat-label>
        <input
          matInput
          type="password"
          name="newPassword"
          [(ngModel)]="pass"
          required
        />
      </mat-form-field>

      <!-- CONFIRM -->
      <mat-form-field appearance="outline" class="full-width-field">
        <mat-label>Confirm Password</mat-label>
        <input
          matInput
          type="password"
          name="confPassword"
          [(ngModel)]="confPass"
          required
        />
      </mat-form-field>

      <!-- ---------------------------------------------- -->
      <!--             ALL @if BELOW THIS POINT           -->
      <!-- ---------------------------------------------- -->

      @if (pass !== confPass && pass.length > 0) {
        <div class="error-message">
          <mat-icon color="warn">close</mat-icon>
          Passwords do not match.
        </div>
      }

      @if (success()) {
        <div class="success-message">
          <mat-icon color="primary">check</mat-icon>
          Password changed successfully!
        </div>
      }

      @if (error()) {
        <div class="error-message">
          <mat-icon color="warn">close</mat-icon>
          Error processing request.
        </div>
      }

      <button
        mat-raised-button
        color="primary"
        class="login-button"
        [disabled]="pass !== confPass || pass.length < 4"
        type="submit"
      >
        Set Password
      </button>

      <button
        type="button"
        mat-stroked-button
        color="accent"
        class="guest-button"
        routerLink="/"
      >
        Back to Login
      </button>
    </form>

  </mat-card>
</div>
