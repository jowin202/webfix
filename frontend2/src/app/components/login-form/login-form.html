<div class="chat-container">
  <mat-card class="login-card">
    <mat-card-title>Login to Chat</mat-card-title>
    
    <form #form="ngForm" class="login-form">
      
      <mat-form-field appearance="outline" class="full-width-field">
        <mat-label>Username</mat-label>
        <input 
          matInput 
          type="text" 
          id="username" 
          name="username" 
          ngModel 
          required
        />
      </mat-form-field>
      
      <mat-form-field appearance="outline" class="full-width-field">
        <mat-label>Password</mat-label>
        <input 
          matInput 
          type="password" 
          id="password" 
          name="password" 
          ngModel 
        />
        <mat-hint>Keep empty for FIDO2 login</mat-hint>
      </mat-form-field>
      
      @if (passwordError()) {
        <div class="error-message">
          <mat-icon color="warn">close</mat-icon> Incorrect username or password.
        </div>
      }
      
      <button 
        mat-raised-button 
        color="primary" 
        class="login-button" 
        (click)="do_page_login(form.value)"
        [disabled]="form.invalid"
      >
        Login
      </button>
      
      <div class="extra-actions">
        <button type="button" mat-button [routerLink]="'/register'"> Register</button>
        <button type="button" mat-button [routerLink]="'/forgot-password'">Forgot Password?</button>
      </div>
    </form>
    
    @if (allowGuestLogin()) {
      <mat-divider class="separator"></mat-divider>
      
      <form #form1="ngForm" class="guest-form">
        <mat-form-field appearance="outline" class="full-width-field">
          <mat-label>Guest Name</mat-label>
          <input 
            matInput 
            type="text" 
            id="guestName" 
            name="guestName" 
            ngModel 
            required
          />
        </mat-form-field>
        
        @if (guestError()) {
          <div class="error-message">
            <mat-icon color="warn">close</mat-icon> Invalid username or username already taken.
          </div>
        }
        
        <button 
          mat-stroked-button 
          color="accent" 
          class="guest-button" 
          (click)="do_guest_login(form1.value)"
          [disabled]="form1.invalid"
        >
          Continue as Guest
        </button>
      </form>
    }
    
    <div class="online-count">
      <mat-icon color="accent">circle</mat-icon> {{ numUsersOnline() }} users online
    </div>
  </mat-card>
</div>
