image: docker:24
services:
  - docker:24-dind
stages:
  - build
  - deploy
variables:
  DOCKER_HOST: tcp://docker:2375  # Set the Docker daemon host for Docker-in-Docker
  DOCKER_TLS_CERTDIR: ""          # Disable TLS for Docker-in-Docker, as TLS is not used by default here
  DOCKER_BUILDKIT: "1"
before_script:
  - echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin $CI_REGISTRY
  - echo $CI_REGISTRY
  - echo $CI_REGISTRY_IMAGE
build:
  stage: build
  # Retry the whole job on transient runner/registry failures (e.g. "blob unknown to registry").
  retry: 2
  script:
    # Reuse layers from the last pushed image instead of rebuilding everything from scratch.
    # Smaller, faster pushes are also less likely to hit transient registry errors.
    - docker pull $CI_REGISTRY_IMAGE:latest || true
    - docker build --cache-from $CI_REGISTRY_IMAGE:latest -t $CI_REGISTRY_IMAGE .
    # A build can succeed while the push flakes (e.g. "blob unknown to registry").
    # Retry just the push a few times before giving up, instead of paying for a full rebuild.
    - |
      attempt=1
      max_attempts=3
      until docker push $CI_REGISTRY_IMAGE; do
        if [ "$attempt" -ge "$max_attempts" ]; then
          echo "docker push failed after $max_attempts attempts"
          exit 1
        fi
        echo "docker push failed (attempt $attempt/$max_attempts), retrying in 10s..."
        attempt=$((attempt + 1))
        sleep 10
      done



deploy:
  stage: deploy
  image: alpine:latest
  before_script:
    - apk add --no-cache openssh-client docker-cli
    - mkdir -p ~/.ssh
    - echo "$SSH_PRIVATE_KEY" | sed 's/\r$//' > ~/.ssh/id_rsa
    - chmod 600 ~/.ssh/id_rsa
    - ssh-keyscan jowin.at >> ~/.ssh/known_hosts
  script:
    - ssh -tt -o StrictHostKeyChecking=no deploy@jowin.at "cd /home/deploy/chat/ &&  docker-compose down &&  docker login $CI_REGISTRY -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD &&  docker image rm registry.jowin.at/jowin202/webfix:latest -f || true && docker-compose up -d"
      
