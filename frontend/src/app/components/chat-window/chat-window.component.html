<div class="chat-container">
  <div class="chat-window">
    <div class="messages" #messagesContainer>
      <div *ngFor="let message of messages" class="message">
        <span [innerHTML]="message.username"></span>:&nbsp;<span [innerHTML]="message.message"></span>
      </div>
    </div>
    <input
      (keydown.enter)="sendMessage(inputField.value); inputField.value='';"
      placeholder="Nachricht eingeben..."
      class="message-input" #inputField
    />
  </div>

  <div class="user-list">
    <h3>Online</h3>
    <ul>
      <li *ngFor="let user of onlineUsers"><span [innerHTML]="user.username_html"></span></li>
    </ul>
  </div>
</div>
