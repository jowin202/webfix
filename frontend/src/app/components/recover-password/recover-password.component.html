<div class="chat-container">
  <div class="login-window">
    <h2>Set New Password</h2>
    <form #resetForm="ngForm" (ngSubmit)="resetPassword(resetForm.value)">
      <div class="form-group">
        <label for="newPassword">New Password</label>
        <input
          type="password"
          id="newPassword"
          class="input-field"
          name="newPassword"
          ngModel
          required
        />
      </div>
      <!-- Success/Error messages -->
      <div class="success-message" *ngIf="this.success">
        ✅ Password changed
      </div>
      <div class="error-message" *ngIf="this.error">
        ❌ Error
      </div>
      <button class="login-button" type="submit">Set Password</button>
    </form>
  </div>
</div>
