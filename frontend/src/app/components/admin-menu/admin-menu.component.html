<form #userMenuForm="ngForm" (ngSubmit)="do_changes(userMenuForm.value)">
  
  <fieldset>
    <legend>Chat Settings</legend>
    <div class="form-group">
      <label for="allow_guest_login">Allow Guest Login</label>
      <input type="checkbox" id="allow_guest_login" name="allow_guest_login"
        [ngModel]="menu_values?.allow_guest_login" />
    </div>
    <div class="form-group">
      <label for="activate_timeout">Activate Timeout</label>
      <input type="checkbox" id="activate_timeout" name="activate_timeout" [ngModel]="menu_values?.activate_timeout" />
    </div>
    <div class="form-group">
      <label for="mandatory_user_verification">Mandatory User Verification</label>
      <input type="checkbox" id="mandatory_user_verification" name="mandatory_user_verification"
        [ngModel]="menu_values?.mandatory_user_verification" />
    </div>
    <div class="form-group">
      <label for="user_verification_mail">User Verification via Mail</label>
      <input type="checkbox" id="user_verification_mail" name="user_verification_mail"
        [ngModel]="menu_values?.user_verification_mail" />
    </div>
    <div class="form-group">
      <label for="user_verification_fediverse">User Verification via Fediverse</label>
      <input type="checkbox" id="user_verification_fediverse" name="user_verification_fediverse"
        [ngModel]="menu_values?.user_verification_fediverse" />
    </div>
    <div class="form-group">
      <label for="announcement_general">Announcement (for all users):</label>
      <textarea id="announcement_general" name="announcement_general" rows="4" cols="40" [ngModel]="menu_values?.announcement_general" ngModel></textarea>
    </div>
    <div class="form-group">
      <label for="announcement_guests">Announcement (for all guests):</label>
      <textarea id="announcement_guests" name="announcement_guests" rows="4" cols="40" [ngModel]="menu_values?.announcement_guests" ngModel></textarea>
    </div>
    <div class="form-group">
      <label for="announcement_registered_users">Announcement (for all registered users):</label>
      <textarea id="announcement_registered_users" name="announcement_registered_users" rows="4" cols="40" [ngModel]="menu_values?.announcement_registered_users" ngModel></textarea>
    </div>
    <div class="form-group">
      <label for="announcement_team">Announcement (for admin team):</label>
      <textarea id="announcement_team" name="announcement_team" rows="4" cols="40" [ngModel]="menu_values?.announcement_team" ngModel></textarea>
    </div>


    <div class="form-group">
      <label for="timeout_time">Timeout time (sec):</label>
      <input id="timeout_time" type="number" name="timeout_time" [ngModel]="menu_values.timeout_time" ngModel />
    </div>
    <div class="form-group">
      <label for="disconnected_timeout_time">Timeout time without websocket (sec):</label>
      <input id="disconnected_timeout_time" type="number" name="disconnected_timeout_time" [ngModel]="menu_values.disconnected_timeout_time" ngModel />
    </div>
    <div class="form-group">
      <label for="pw_recovery_token_valid_time">Passwort recovery link time (sec):</label>
      <input id="pw_recovery_token_valid_time" type="number" name="pw_recovery_token_valid_time" [ngModel]="menu_values.pw_recovery_token_valid_time" ngModel />
    </div>
    <div class="form-group">
      <label for="fido2_challenge_valid_time">FIDO2 max challenge time (sec):</label>
      <input id="fido2_challenge_valid_time" type="number" name="fido2_challenge_valid_time" [ngModel]="menu_values.fido2_challenge_valid_time" ngModel />
    </div>
    <div class="form-group">
      <label for="pw_min_len">Min Password Length:</label>
      <input id="pw_min_len" name="pw_min_len" type="number" [ngModel]="menu_values.pw_min_len" ngModel />
    </div>
    <div class="form-actions">
      <span class="form-note">
        @if (this.error) {
        <div>Error: An error occured</div>
        }
      </span>
      <div class="button-group">
        <button type="submit" [disabled]="userMenuForm.value.password !== userMenuForm.value.password2">
          Save
        </button>
        <button type="button" (click)="closeEvent.emit()">Close</button>
      </div>
    </div>
  </fieldset>
</form>

<fieldset style="border: 1px solid #ddd; border-radius: 8px; padding: 1rem; margin-top: 16px;">
  <legend style="font-weight: bold; padding: 0 0.5rem;">User Management</legend>

  <div class="form-group">
    <label for="action_duration">Duration:</label>
    <select id="action_duration" name="action_duration" [(ngModel)]="action_duration">
      <option [ngValue]="60">1 minute</option>
      <option [ngValue]="300">5 minutes</option>
      <option [ngValue]="3600">1 hour</option>
      <option [ngValue]="86400">1 day</option>
      <option [ngValue]="-1">permanent</option>
    </select>
  </div>
  <div class="form-group">
    <label for="action_silent">Silent (no chat notice):</label>
    <input type="checkbox" id="action_silent" name="action_silent" [(ngModel)]="action_silent" />
  </div>

  <span class="form-note">
    @if (this.user_action_error) {
    <div>Error: action failed</div>
    }
  </span>

  <table style="width:100%; border-collapse: collapse; font-size: 14px;">
    <thead>
      <tr style="background: #f9f9f9;">
        <th style="text-align:left; padding: 8px; border-bottom: 1px solid #ccc;">Username</th>
        <th style="text-align:left; padding: 8px; border-bottom: 1px solid #ccc;">Kicked until</th>
        <th style="text-align:left; padding: 8px; border-bottom: 1px solid #ccc;">Muted until</th>
        <th style="text-align:left; padding: 8px; border-bottom: 1px solid #ccc;">Actions</th>
      </tr>
    </thead>
    <tbody>
      @for (u of this.users; track u.id) {
        <tr style="border-bottom: 1px solid #eee;">
          <td style="padding: 8px;"><span [innerHTML]="u.username_html || u.username"></span></td>
          <td style="padding: 8px;">{{ formatTime(u.kicked_until) }}</td>
          <td style="padding: 8px;">{{ formatTime(u.muted_until) }}</td>
          <td style="padding: 8px;">
            <button type="button" (click)="kick_user(u, action_duration, action_silent)">Kick</button>
            <button type="button" (click)="kick_user(u, 0, action_silent)">Unkick</button>
            <button type="button" (click)="mute_user(u, action_duration, action_silent)">Mute</button>
            <button type="button" (click)="mute_user(u, 0, action_silent)">Unmute</button>
          </td>
        </tr>
      }
    </tbody>
  </table>
</fieldset>
