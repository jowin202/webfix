<div class="chat-container">
  <div class="login-window">
    <h2>Request Password Reset</h2>
    <form #requestForm="ngForm">
      <div class="form-group">
        <label for="username">Username</label>
        <input
          type="text"
          class="input-field"
          id="username"
          name="username"
          ngModel
          required
          />
      </div>

      <div class="separator">&nbsp;</div>

      <div class="form-group">
        <label for="mail">Email</label>
        <input
          type="text"
          class="input-field"
          id="mail"
          name="mail"
          ngModel
          placeholder="user@example.com"
          />
      </div>

      <div class="separator">or</div>

      <div class="form-group">
        <label for="fediverse_id">Fediverse ID</label>
        <input
          type="text"
          class="input-field"
          id="fediverse_id"
          name="fediverse_id"
          ngModel
          placeholder="@user@mastodon.social"
          />
      </div>
      @if (this.success) {
        <div class="success-message">
          ✅ If the information you entered is correct, you will receive a confirmation email (or a message in the Fediverse) with a link to reset your password.
        </div>
      }
      @if (this.error) {
        <div class="error-message">
          ❌ Error
        </div>
      }
      <button class="login-button" (click)="requestReset(requestForm.value)">Send Reset Link</button>
      <button type="button" class="guest-button" [routerLink]="'/'">Back to Login</button>
    </form>
  </div>
</div>
