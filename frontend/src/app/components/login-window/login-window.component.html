<div class="chat-container">
  <div class="login-window">
    <h2>Login to Chat</h2>
    <form #form="ngForm">
      <div class="form-group">
        <label for="username">Username</label>
        <input type="text" id="username" class="input-field" name="username" ngModel />
      </div>
      <div class="form-group">
        <label for="password">Password</label>
        <input type="password" id="password" class="input-field" name="password" ngModel />
      </div>

      <!-- Password error message -->
      <div class="error-message" *ngIf="this.auth.password_error;">
        ❌ Incorrect username or password.
      </div>

      <button class="login-button" (click)="do_page_login(form.value);">Login</button>
      <div class="separator">or</div>

      <!-- Guest login -->
      <div class="form-group">
        <label for="guestName">Guest Name</label>
        <input type="text" id="guestName" class="input-field" name="guestName" ngModel/>
      </div>
      <button class="guest-button" (click)="do_guest_login(form.value)">Continue as Guest</button>

      <div class="online-count">🟢 13 users online</div>
    </form>
  </div>
</div>
