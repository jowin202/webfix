name: Build container

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: type=raw,value=latest

      - uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          # Single manifest without attestations, so untagged versions are really obsolete.
          provenance: false
          sbom: false

      # Only keep the current image: remove the old versions that lost the "latest" tag.
      - name: Delete old image versions
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OWNER: ${{ github.repository_owner }}
          OWNER_TYPE: ${{ github.event.repository.owner.type }}
        run: |
          pkg="${GITHUB_REPOSITORY#*/}"
          pkg="${pkg,,}"
          if [ "$OWNER_TYPE" = "Organization" ]; then
            base="/orgs/$OWNER/packages/container/$pkg/versions"
          else
            base="/users/$OWNER/packages/container/$pkg/versions"
          fi
          gh api --paginate "$base" --jq '.[] | select(.metadata.container.tags | length == 0) | .id' |
            while read -r id; do
              echo "Deleting version $id"
              gh api -X DELETE "$base/$id"
            done
