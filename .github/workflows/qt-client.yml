name: Build Qt client

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  QT_VERSION: "6.8.3"

jobs:
  macos:
    name: macOS (Apple Silicon)
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v7

      - uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          modules: qtwebsockets
          cache: true

      - name: Build
        run: |
          mkdir build && cd build
          qmake ../WebfixClient/WebfixClient.pro CONFIG+=release CONFIG-=debug_and_release QMAKE_APPLE_DEVICE_ARCHS=arm64
          make -j"$(sysctl -n hw.ncpu)"
          macdeployqt WebfixClient.app
          # macdeployqt invalidates the linker's ad-hoc signature; unsigned arm64 apps show up as "damaged".
          codesign --force --deep --sign - WebfixClient.app
          codesign --verify --deep --strict WebfixClient.app
          mkdir dmg && mv WebfixClient.app dmg/ && ln -s /Applications dmg/Applications
          hdiutil create -volname WebfixClient -srcfolder dmg -ov -format UDZO ../WebfixClient-macos-arm64.dmg

      - uses: actions/upload-artifact@v7
        with:
          name: macos
          path: WebfixClient-macos-arm64.dmg
          retention-days: 1

  windows:
    name: Windows (x64)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          arch: win64_msvc2022_64
          modules: qtwebsockets
          cache: true

      - name: Build
        shell: pwsh
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          # Load the MSVC x64 build environment (cl, nmake) into this shell.
          $vs = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          $envCmd = "$env:RUNNER_TEMP\vcenv.cmd"
          "@call `"$vs\VC\Auxiliary\Build\vcvars64.bat`" >nul`r`n@set" | Set-Content $envCmd
          & $envCmd | ForEach-Object {
            if ($_ -match '^([^=]+)=(.*)$') { Set-Item "env:$($matches[1])" $matches[2] }
          }
          $Deploy = "$env:GITHUB_WORKSPACE\deploy"
          New-Item -ItemType Directory build, $Deploy | Out-Null
          cd build
          qmake ..\WebfixClient\WebfixClient.pro CONFIG+=release CONFIG-=debug_and_release "DESTDIR=$Deploy"
          nmake
          windeployqt --release --no-translations --compiler-runtime "$Deploy\WebfixClient.exe"
          Compress-Archive -Path "$Deploy\*" -DestinationPath "$env:GITHUB_WORKSPACE\WebfixClient-windows-x64.zip"

      - uses: actions/upload-artifact@v7
        with:
          name: windows
          path: WebfixClient-windows-x64.zip
          retention-days: 1

  release:
    name: Publish "latest" release
    needs: [macos, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          merge-multiple: true

      # Replace the previous "latest" release so only the newest build is offered.
      - name: Publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release delete latest --cleanup-tag --yes || true
          gh release create latest \
            WebfixClient-macos-arm64.dmg \
            WebfixClient-windows-x64.zip \
            --target "$GITHUB_SHA" \
            --title "Webfix Client" \
            --notes "Build from ${GITHUB_SHA::7}" \
            --latest
